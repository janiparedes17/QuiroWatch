<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuiroWatch — Bloque Quirúrgico Central</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --panel: #ffffff;
    --panel-border: #d0dce8;
    --panel-glow: #e2ecf5;
    --accent: #0077ff;
    --accent2: #0055cc;
    --green: #00e676;
    --green-glow: rgba(0,230,118,0.18);
    --red: #ff3d3d;
    --red-glow: rgba(255,61,61,0.18);
    --amber: #ffaa00;
    --text-primary: #0d1f35;
    --text-secondary: #4a6a8a;
    --text-dim: #9ab0c4;
    --mono: 'Share Tech Mono', monospace;
    --ui: 'Rajdhani', sans-serif;
    --display: 'Barlow Condensed', sans-serif;
    --body: 'Exo 2', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0f4f8;
    color: var(--text-primary);
    font-family: var(--body);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(0,119,255,0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(0,198,255,0.04) 0%, transparent 50%);
  }

  body::before { display:none; }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    background: linear-gradient(180deg, #ffffff 0%, #f0f4f8 100%);
    border-bottom: 1px solid var(--panel-border);
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .brand-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #0044aa, #0077ff);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 0 16px rgba(0,119,255,0.5);
  }
  .brand-icon svg { width: 26px; height: 26px; }

  .brand-pulse {
    position: absolute; inset: -3px;
    border-radius: 14px;
    border: 1px solid rgba(0,198,255,0.4);
    animation: pulse-ring 2.5s ease-in-out infinite;
  }
  @keyframes pulse-ring {
    0%,100% { opacity:0.4; transform:scale(1); }
    50% { opacity:0.8; transform:scale(1.06); }
  }

  .brand-text { display: flex; flex-direction: column; }

  .brand-name {
    font-family: var(--display);
    font-size: 26px; font-weight: 800;
    letter-spacing: 2px; color: var(--text-primary); line-height: 1;
  }
  .brand-name span { color: var(--accent); }

  .brand-sub {
    font-family: var(--mono);
    font-size: 10px; color: var(--text-secondary);
    letter-spacing: 3px; text-transform: uppercase; margin-top: 3px;
  }

  .header-center { text-align: center; flex: 1; }

  .header-title {
    font-family: var(--display);
    font-size: 26px; font-weight: 800;
    letter-spacing: 5px; color: var(--text-primary);
    text-transform: uppercase;
  }

  .header-subtitle {
    font-family: var(--body);
    font-size: 14px; font-weight: 300;
    color: var(--text-secondary); letter-spacing: 2px; margin-top: 3px;
  }

  .header-time { text-align: right; }

  #clock {
    font-family: var(--mono);
    font-size: 38px; color: var(--accent);
    letter-spacing: 3px; line-height: 1;
    text-shadow: 0 0 20px rgba(0,198,255,0.4);
  }
  #date {
    font-family: var(--mono);
    font-size: 13px; color: var(--text-secondary);
    letter-spacing: 2px; margin-top: 4px;
  }

  /* SUMMARY BAR */
  .summary-bar {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 0;
    background: #f0f4f8;
    border-bottom: 1px solid var(--panel-border);
    padding: 0 32px;
  }

  .summary-item {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px 56px;
    position: relative;
  }

  .summary-item + .summary-item::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; bottom: 20%;
    width: 1px;
    background: var(--panel-border);
  }

  .summary-number {
    font-family: var(--display);
    font-size: 72px; font-weight: 800; line-height: 1;
  }
  .summary-number.green { color: var(--green); text-shadow: 0 0 24px rgba(0,230,118,0.5); }
  .summary-number.red   { color: var(--red);   text-shadow: 0 0 24px rgba(255,61,61,0.5); }

  .summary-label { display: flex; flex-direction: column; gap: 3px; }

  .summary-label-main {
    font-family: var(--display);
    font-size: 20px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
  }
  .summary-label-main.green { color: var(--green); }
  .summary-label-main.red   { color: var(--red); }

  .summary-label-sub {
    font-size: 13px; color: var(--text-secondary);
    letter-spacing: 1px; font-weight: 300;
  }

  /* MAIN GRID */
  .main { padding: 20px 24px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }

  /* CARD */
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 16px 16px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: card-in 0.5s ease backwards;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent2), transparent);
    opacity: 0.5;
  }

  .card.incidence {
    border-color: rgba(255,61,61,0.5);
    background: #ffffff;
    box-shadow: 0 0 24px rgba(255,61,61,0.1), inset 0 0 30px rgba(255,61,61,0.03);
    animation: card-alert 3s ease-in-out infinite;
  }

  .card.incidence::before {
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    opacity: 0.7;
  }

  @keyframes card-alert {
    0%,100% { box-shadow: 0 0 24px rgba(255,61,61,0.1), inset 0 0 30px rgba(255,61,61,0.03); }
    50%      { box-shadow: 0 0 36px rgba(255,61,61,0.25), inset 0 0 40px rgba(255,61,61,0.07); }
  }

  @keyframes card-in {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .card:nth-child(1)  { animation-delay:0.05s; }
  .card:nth-child(2)  { animation-delay:0.10s; }
  .card:nth-child(3)  { animation-delay:0.15s; }
  .card:nth-child(4)  { animation-delay:0.20s; }
  .card:nth-child(5)  { animation-delay:0.25s; }
  .card:nth-child(6)  { animation-delay:0.30s; }
  .card:nth-child(7)  { animation-delay:0.35s; }
  .card:nth-child(8)  { animation-delay:0.40s; }
  .card:nth-child(9)  { animation-delay:0.45s; }
  .card:nth-child(10) { animation-delay:0.50s; }

  .card-header { display: flex; flex-direction: column; gap: 3px; }

  .card-name {
    font-family: var(--display);
    font-size: 16px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-primary);
  }

  .card-specialty {
    font-size: 12px; color: var(--text-secondary);
    font-weight: 300; letter-spacing: 0.5px;
  }

  /* STATUS INDICATOR */
  .status-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
  }

  .status-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  .status-icon.ok {
    background: radial-gradient(circle at 40% 35%, #00ff8a, #00a852);
    box-shadow: 0 0 20px rgba(0,230,118,0.6), 0 0 40px rgba(0,230,118,0.2);
  }
  .status-icon.ok::after {
    content: '';
    position: absolute; inset: -6px; border-radius: 50%;
    border: 1px solid rgba(0,230,118,0.3);
    animation: ok-pulse 2s ease-in-out infinite;
  }
  @keyframes ok-pulse {
    0%,100% { transform:scale(1); opacity:0.5; }
    50%      { transform:scale(1.15); opacity:0.1; }
  }

  .status-icon.err {
    background: radial-gradient(circle at 40% 35%, #ff6b6b, #cc1a1a);
    box-shadow: 0 0 20px rgba(255,61,61,0.7), 0 0 40px rgba(255,61,61,0.3);
    animation: err-shake 0.5s ease-in-out infinite alternate;
  }
  .status-icon.err::after {
    content: '';
    position: absolute; inset: -6px; border-radius: 50%;
    border: 1px solid rgba(255,61,61,0.5);
    animation: err-pulse 1.2s ease-in-out infinite;
  }
  @keyframes err-shake {
    0%   { box-shadow: 0 0 20px rgba(255,61,61,0.7), 0 0 40px rgba(255,61,61,0.3); }
    100% { box-shadow: 0 0 28px rgba(255,61,61,0.9), 0 0 55px rgba(255,61,61,0.4); }
  }
  @keyframes err-pulse {
    0%,100% { transform:scale(1); opacity:0.6; }
    50%      { transform:scale(1.2); opacity:0.1; }
  }

  .status-icon svg { width: 32px; height: 32px; color: white; }

  .status-label {
    font-family: var(--display);
    font-size: 14px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
  }
  .status-label.ok  { color: var(--green); }
  .status-label.err { color: var(--red); }

  .incident-tag {
    background: rgba(255,61,61,0.12);
    border: 1px solid rgba(255,61,61,0.3);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 10px; color: var(--red);
    letter-spacing: 1px; text-align: center;
    font-weight: 600; text-transform: uppercase;
  }

  /* PARAMS */
  .params {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 1px solid var(--panel-border);
    padding-top: 12px;
  }

  .param {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .param-name {
    font-size: 12px; color: var(--text-secondary);
    font-weight: 400; letter-spacing: 0.5px;
  }

  .param-value {
    font-family: var(--mono);
    font-size: 13px; color: var(--text-primary);
    letter-spacing: 0.5px;
  }
  .param-value.alert { color: var(--red); font-weight: 700; }

  .param-dot {
    flex: 1; height: 1px; margin: 0 8px;
    background: repeating-linear-gradient(
      90deg, var(--text-dim) 0, var(--text-dim) 2px,
      transparent 2px, transparent 5px
    );
    opacity: 0.5;
  }

  /* FOOTER */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 32px;
    background: #ffffff;
    border-top: 1px solid var(--panel-border);
    margin-top: 4px;
    position: relative;
  }
  footer::before {
    content: '';
    position: absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.3;
  }

  .footer-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-secondary);
    font-family: var(--mono); letter-spacing: 1px;
  }

  .footer-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: dot-blink 2s ease-in-out infinite;
  }
  @keyframes dot-blink {
    0%,100% { opacity:1; }
    50%      { opacity:0.3; }
  }

  .footer-icon { color: var(--accent); opacity: 0.7; }

  .card-corner {
    position: absolute; top:8px; right:10px;
    width:18px; height:18px; opacity:0.15;
  }
  .card-corner::before, .card-corner::after {
    content:''; position:absolute; background:var(--accent);
  }
  .card-corner::before { top:0; right:0; width:1px; height:10px; }
  .card-corner::after  { top:0; right:0; width:10px; height:1px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">
      <div class="brand-pulse"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
    </div>
    <div class="brand-text">
      <div class="brand-name">Quiro<span>Watch</span></div>
      <div class="brand-sub">Monitorización ambiental</div>
    </div>
  </div>

  <div class="header-center">
    <div class="header-title">Bloque Quirúrgico Central</div>
    <div class="header-subtitle">Hospital Universitario San Juan de Alicante</div>
  </div>

  <div class="header-time">
    <div id="clock">--:--:--</div>
    <div id="date">--/--/----</div>
  </div>
</header>

<div class="summary-bar">
  <div class="summary-item">
    <div class="summary-number green" id="count-ok">--</div>
    <div class="summary-label">
      <div class="summary-label-main green">Operativas</div>
      <div class="summary-label-sub">Salas en condiciones óptimas</div>
    </div>
  </div>
  <div class="summary-item">
    <div class="summary-number red" id="count-inc">--</div>
    <div class="summary-label">
      <div class="summary-label-main red">Con Incidencia</div>
      <div class="summary-label-sub">Requieren atención</div>
    </div>
  </div>
</div>

<div class="main">
  <div class="grid" id="grid"></div>
</div>

<footer>
  <div class="footer-item">
    <svg class="footer-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
    Última actualización: <span id="last-update">--/--/---- --:--:--</span>
  </div>
  <div class="footer-item">
    <svg class="footer-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
    Actualización automática cada 30 segundos
    <div class="footer-dot"></div>
  </div>
</footer>

<script>
  const N8N_URL = 'http://localhost:5678/webhook/mapa';

  const ESPECIALIDADES = {
    1:'Cirugía general', 2:'Maxilofacial', 3:'Ginecología y obstetricia',
    4:'Urología', 5:'Otorrinolaringología', 6:'Urgencias',
    7:'Traumatología', 8:'Traumatología', 9:'Oftalmología 1', 10:'Oftalmología 2'
  };

  function pad(n) { return String(n).padStart(2,'0'); }

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('date').textContent =
      `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  }

  updateClock();
  setInterval(updateClock, 1000);

  function renderGrid(quirofanos) {
    const grid = document.getElementById('grid');
    let countOk = 0, countInc = 0;

    grid.innerHTML = quirofanos.map(q => {
      const ok = q.semaforo_global === 'verde';
      if (ok) countOk++; else countInc++;

      const nombre = q.quirofano <= 8
        ? `Quirófano ${pad(q.quirofano)}`
        : `Oftalmología ${q.quirofano - 8}`;
      const especialidad = ESPECIALIDADES[q.quirofano] || '';

      const problemas = [];
      if (q.temperatura_vigia !== null && (q.temperatura_vigia < 18 || q.temperatura_vigia > 24)) problemas.push('Temp. VIGIA');
      if (q.humedad_vigia !== null && (q.humedad_vigia < 45 || q.humedad_vigia > 65)) problemas.push('Humedad VIGIA');
      if (q.presion_diferencial !== null && (q.presion_diferencial < 5 || q.presion_diferencial > 20)) problemas.push('Presión dif.');
      if (q.temperatura_sensor !== null && (q.temperatura_sensor < 18 || q.temperatura_sensor > 24)) problemas.push('Temp. sensor');
      if (q.humedad_sensor !== null && (q.humedad_sensor < 45 || q.humedad_sensor > 65)) problemas.push('Humedad sensor');

      const incidentTag = !ok && problemas.length > 0
        ? `<div class="incident-tag">${problemas[0]} fuera de rango</div>` : '';

      const statusIcon = ok
        ? `<div class="status-icon ok">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
           </div>
           <div class="status-label ok">Operativa</div>`
        : `<div class="status-icon err">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
           </div>
           <div class="status-label err">Incidencia</div>
           ${incidentTag}`;

      const params = [];
      if (q.temperatura_vigia !== null)
        params.push({ name:'Temp. VIGIA', val:`${q.temperatura_vigia.toFixed(2)} °C`, alert: q.temperatura_vigia < 18 || q.temperatura_vigia > 24 });
      if (q.humedad_vigia !== null)
        params.push({ name:'Humedad VIGIA', val:`${q.humedad_vigia.toFixed(2)} %`, alert: q.humedad_vigia < 45 || q.humedad_vigia > 65 });
      if (q.presion_diferencial !== null)
        params.push({ name:'Presión dif.', val:`${q.presion_diferencial.toFixed(2)} Pa`, alert: q.presion_diferencial < 5 || q.presion_diferencial > 20 });
      if (q.temperatura_sensor !== null)
        params.push({ name:'Temp. sensor', val:`${q.temperatura_sensor.toFixed(2)} °C`, alert: q.temperatura_sensor < 18 || q.temperatura_sensor > 24 });
      if (q.humedad_sensor !== null)
        params.push({ name:'Humedad sensor', val:`${q.humedad_sensor.toFixed(2)} %`, alert: q.humedad_sensor < 45 || q.humedad_sensor > 65 });

      const paramsHtml = params.map(p => `
        <div class="param">
          <span class="param-name">${p.name}</span>
          <span class="param-dot"></span>
          <span class="param-value${p.alert?' alert':''}">${p.val}</span>
        </div>`).join('');

      return `
        <div class="card${ok?'':' incidence'}">
          <div class="card-corner"></div>
          <div class="card-header">
            <div class="card-name">${nombre}</div>
            <div class="card-specialty">${especialidad}</div>
          </div>
          <div class="status-block">${statusIcon}</div>
          <div class="params">${paramsHtml}</div>
        </div>`;
    }).join('');

    document.getElementById('count-ok').textContent = countOk;
    document.getElementById('count-inc').textContent = countInc;

    const now = new Date();
    document.getElementById('last-update').textContent =
      `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }

  async function fetchData() {
    try {
      const res = await fetch(N8N_URL);
      const data = await res.json();
      if (data.quirofanos) renderGrid(data.quirofanos);
    } catch(e) {
      console.error('Error al obtener datos:', e);
    }
  }

  fetchData();
  setInterval(fetchData, 30000);
</script>
</body>
</html>
